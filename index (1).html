<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAChecklistCenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10261c; --muted:#4d6b5c; --paper:#f3f8f5; --line:#cfe0d6;
  --green:#00875a; --deep:#0b4d2e; --amber:#ffe082; --danger:#b3261e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Sarabun','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:var(--paper);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}

/* ── Login ── */
#login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:var(--deep);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.brand h1{font-size:clamp(34px,5vw,56px);line-height:1.08;font-weight:800;letter-spacing:-.02em;max-width:11ch}
.brand p{max-width:34ch;color:#cfe8da;margin-top:18px}
.brand small{color:#9cc7b0}
.tick{width:64px;height:64px;border:3px solid var(--amber);border-radius:14px;display:grid;place-items:center;color:var(--amber);font-size:36px;font-weight:800}
.formside{display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:100%;max-width:380px}
.box h2{font-size:26px;margin-bottom:4px}
.box .sub{color:var(--muted);margin-bottom:22px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(0,135,90,.18)}
.btn{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:700}
.btn:hover{background:#00694a}
.btn:disabled{opacity:.55;cursor:wait}
.link{background:none;border:0;color:var(--green);font-weight:700;margin-top:16px;padding:4px 0}
.msg{margin-top:14px;font-size:14px;color:var(--danger);min-height:20px}

/* ── App shell ── */
header{background:var(--deep);color:#fff;display:flex;align-items:center;gap:14px;padding:0 28px;height:58px;position:sticky;top:0;z-index:5}
header .logo{font-weight:800;font-size:18px;cursor:pointer}
header .sp{flex:1}
.who{font-size:14px;color:#cfe8da}
.role{background:var(--amber);color:var(--ink);font-weight:700;font-size:12px;padding:2px 9px;border-radius:20px;margin-left:8px}
.out{background:transparent;border:1.5px solid #5f9a7d;color:#fff;border-radius:7px;padding:6px 12px;font-size:14px}
.out:hover{background:rgba(255,255,255,.12)}
main{max-width:980px;margin:0 auto;padding:34px 24px 60px}
.crumb{color:var(--muted);font-size:14px;margin-bottom:6px}
.crumb button{background:none;border:0;color:var(--green);font-weight:700;padding:0}
h2.page{font-size:30px;font-weight:800;letter-spacing:-.01em}
.lead{color:var(--muted);margin:4px 0 24px}

/* rows (departments + checklists) */
.list{border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:15px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.row.go:hover{background:#e6f2ec}
.row .code{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .name{font-weight:700;font-size:17px}
.row .name small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.tag{font-size:13px;font-weight:700;padding:3px 11px;border-radius:20px;white-space:nowrap}
.tag.on{background:var(--green);color:#fff}
.tag.soon{background:#e3ece7;color:var(--muted)}
.row.off{cursor:default}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:15px;z-index:20}
@media(max-width:760px){
  #login{grid-template-columns:1fr}.brand{padding:28px;gap:30px}
  .row{grid-template-columns:1fr auto}.row .code{grid-column:1/-1;margin-bottom:-10px}
  header{padding:0 14px}.who span.n{display:none}
}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>

<!-- ───── Login ───── -->
<section id="login" class="hidden">
  <div class="brand">
    <div class="tick">✓</div>
    <div>
      <h1>CAChecklistCenter</h1>
      <p>บันทึกและติดตามเช็คลิสต์ตรวจสอบอุปกรณ์ ESD ของหน่วยงาน QS</p>
    </div>
    <small>โครงการวิจัย Digital Checklist</small>
  </div>
  <div class="formside">
    <div class="box">
      <h2 id="ttl">เข้าสู่ระบบ</h2>
      <p class="sub" id="sub">ใช้อีเมลและรหัสผ่านของคุณ</p>
      <div id="nameWrap" class="hidden"><label for="fName">ชื่อที่แสดง</label><input id="fName" autocomplete="name"></div>
      <label for="fEmail">อีเมล</label><input id="fEmail" type="email" autocomplete="email">
      <label for="fPass">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><input id="fPass" type="password" autocomplete="current-password">
      <button class="btn" id="go">เข้าสู่ระบบ</button>
      <p class="msg" id="msg" role="alert"></p>
      <button class="link" id="swap">ยังไม่มีบัญชี? สมัครใช้งาน</button>
    </div>
  </div>
</section>

<!-- ───── App ───── -->
<div id="app" class="hidden">
  <header>
    <span class="logo" id="logo">CAChecklistCenter</span>
    <span class="sp"></span>
    <span class="who"><span class="n" id="who"></span><span class="role" id="role"></span></span>
    <button class="out" id="logout">ออกจากระบบ</button>
  </header>
  <main id="view"></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAEZW8kCrSkXOvrMsVK0LwJ-4eBEj0bcKA",
  authDomain: "cachecklistcenter.firebaseapp.com",
  projectId: "cachecklistcenter",
  storageBucket: "cachecklistcenter.firebasestorage.app",
  messagingSenderId: "974811458263",
  appId: "1:974811458263:web:c5da1b2539aee15172de92"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── ข้อมูลเมนู (รหัสเอกสารจากไฟล์ QS_ESD_Checklist_Consolidated) ── */
const DEPTS = [
  {id:'QS', name:'QS', desc:'Quality System — เช็คลิสต์อุปกรณ์ ESD', on:true},
  {id:'QC', name:'QC', desc:'Quality Control'},
  {id:'PE', name:'PE', desc:'Process Engineering'},
  {id:'TE', name:'TE', desc:'Test Engineering'},
  {id:'WH', name:'WH', desc:'Warehouse'}
];
const QS_FORMS = [
  {code:'—',           name:'Wrist Strap & Footwear', desc:'ตรวจรายวัน'},
  {code:'4CA-067T.03', name:'Air Ionizer',            desc:'รายงานเครื่องเป่าลมไอออนประจำเดือน', next:true},
  {code:'4CA-071T.01', name:'Chair / Seat Report',    desc:'เก้าอี้ป้องกันไฟฟ้าสถิต'},
  {code:'4CA-076T.01', name:'Common Point Ground',    desc:'จุดลงกราวด์ร่วม'},
  {code:'4CA-073T.02', name:'ESD Protective',         desc:'บรรจุภัณฑ์ป้องกันไฟฟ้าสถิต'},
  {code:'4CA-066T.01', name:'ESD Smock & Cap',        desc:'ชุดและหมวกป้องกันไฟฟ้าสถิต'},
  {code:'4PC-129T.04', name:'Ground Box Check',       desc:'กล่องกราวด์'},
  {code:'4CA-070T.01', name:'Magazine Report',        desc:'แม็กกาซีนป้องกันไฟฟ้าสถิต'},
  {code:'4CA-075T.01', name:'Main Ground Line',       desc:'สายกราวด์หลัก'},
  {code:'4CA-072T.01', name:'Mobile Equipment',       desc:'รถเข็นและอุปกรณ์เคลื่อนที่'},
  {code:'4CA-074T.01', name:'Voltage Resistance',     desc:'แรงดันไฟฟ้าและความต้านทานเครื่องจักร'},
  {code:'4CA-069T.03', name:'Worksurface Station',    desc:'พื้นผิวโต๊ะทำงาน'},
  {code:'—',           name:'Racks in Material Store & WIP', desc:''},
  {code:'—',           name:'ESD Dissipative Floor',  desc:''}
];
const ROLE_TH = {checker:'ผู้ตรวจ', approver:'ผู้อนุมัติ', admin:'แอดมิน'};

/* ── Login / สมัคร ── */
let signup = false;
function setMode(s){
  signup = s;
  $('ttl').textContent = s ? 'สมัครใช้งาน' : 'เข้าสู่ระบบ';
  $('sub').textContent = s ? 'บัญชีใหม่จะเริ่มเป็น "ผู้ตรวจ"' : 'ใช้อีเมลและรหัสผ่านของคุณ';
  $('go').textContent = s ? 'สมัครใช้งาน' : 'เข้าสู่ระบบ';
  $('swap').textContent = s ? 'มีบัญชีแล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? สมัครใช้งาน';
  $('nameWrap').classList.toggle('hidden', !s);
  $('fPass').autocomplete = s ? 'new-password' : 'current-password';
  $('msg').textContent = '';
}
$('swap').onclick = () => setMode(!signup);

const ERR = {
  'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
  'auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง',
  'auth/email-already-in-use':'อีเมลนี้มีบัญชีอยู่แล้ว ให้เข้าสู่ระบบแทน',
  'auth/weak-password':'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร',
  'auth/too-many-requests':'ลองหลายครั้งเกินไป รอสักครู่แล้วลองใหม่',
  'auth/network-request-failed':'เชื่อมต่ออินเทอร์เน็ตไม่ได้',
  'auth/operation-not-allowed':'ยังไม่ได้เปิด Email/Password ใน Firebase Authentication'
};
async function submit(){
  const email = $('fEmail').value.trim(), pass = $('fPass').value, name = $('fName').value.trim();
  if(!email || !pass){ $('msg').textContent = 'กรอกอีเมลและรหัสผ่านให้ครบ'; return; }
  if(signup && !name){ $('msg').textContent = 'กรอกชื่อที่แสดง'; return; }
  $('go').disabled = true; $('msg').textContent = '';
  try{
    if(signup){
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, {displayName:name});
      await setDoc(doc(db,'users',c.user.uid), {name, email, role:'checker', createdAt:serverTimestamp()});
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  }catch(e){ $('msg').textContent = ERR[e.code] || ('เกิดข้อผิดพลาด: ' + e.message); }
  $('go').disabled = false;
}
$('go').onclick = submit;
['fEmail','fPass','fName'].forEach(i => $(i).addEventListener('keydown', e => e.key==='Enter' && submit()));
$('logout').onclick = () => signOut(auth);

/* ── โปรไฟล์ผู้ใช้ ── */
let me = null;
async function loadProfile(u){
  const ref = doc(db,'users',u.uid);
  let snap = await getDoc(ref);
  if(!snap.exists()){
    const p = {name:u.displayName || u.email.split('@')[0], email:u.email, role:'checker', createdAt:serverTimestamp()};
    await setDoc(ref, p); snap = await getDoc(ref);
  }
  return {uid:u.uid, ...snap.data()};
}

/* ── หน้าจอ ── */
function toast(t){
  const d = document.createElement('div'); d.className='toast'; d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 2600);
}
function renderHome(){
  $('view').innerHTML = `
    <h2 class="page">เลือกแผนก</h2>
    <p class="lead">ตอนนี้เปิดใช้งานเฉพาะแผนก QS</p>
    <div class="list">` + DEPTS.map(d => `
      <button class="row ${d.on?'go':'off'}" data-d="${d.id}">
        <span class="code">${esc(d.id)}</span>
        <span class="name">${esc(d.name)}<small>${esc(d.desc)}</small></span>
        <span class="tag ${d.on?'on':'soon'}">${d.on?'เปิดใช้งาน':'เร็ว ๆ นี้'}</span>
      </button>`).join('') + `</div>`;
  $('view').querySelectorAll('.row').forEach(b => b.onclick = () => {
    const d = DEPTS.find(x => x.id===b.dataset.d);
    d.on ? (location.hash = 'qs') : toast('แผนก ' + d.name + ' ยังไม่เปิดใช้งาน');
  });
}
function renderQS(){
  $('view').innerHTML = `
    <p class="crumb"><button id="back">แผนก</button> / QS</p>
    <h2 class="page">เช็คลิสต์ QS</h2>
    <p class="lead">${QS_FORMS.length} ฟอร์ม · เริ่มพัฒนาจาก Air Ionizer เป็นต้นแบบ</p>
    <div class="list">` + QS_FORMS.map((f,i) => `
      <button class="row ${f.next?'go':'off'}" data-i="${i}">
        <span class="code">${esc(f.code)}</span>
        <span class="name">${esc(f.name)}${f.desc?`<small>${esc(f.desc)}</small>`:''}</span>
        <span class="tag ${f.next?'on':'soon'}">${f.next?'ขั้นถัดไป':'เร็ว ๆ นี้'}</span>
      </button>`).join('') + `</div>`;
  $('back').onclick = () => location.hash = 'home';
  $('view').querySelectorAll('.row').forEach(b => b.onclick = () => {
    const f = QS_FORMS[+b.dataset.i];
    toast(f.next ? 'ฟอร์ม Air Ionizer จะเปิดใช้งานในขั้นถัดไป' : 'ฟอร์ม ' + f.name + ' ยังไม่เปิดใช้งาน');
  });
}
function route(){
  if(!me) return;
  (location.hash.replace('#','') === 'qs') ? renderQS() : renderHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
$('logo').onclick = () => { location.hash = 'home'; route(); };

/* ── สถานะการล็อกอิน ── */
onAuthStateChanged(auth, async u => {
  if(!u){ me = null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); return; }
  try{
    me = await loadProfile(u);
  }catch(e){
    me = null; await signOut(auth);
    $('msg').textContent = 'อ่านข้อมูลผู้ใช้ไม่ได้ (ตรวจ Firestore Rules): ' + e.message;
    $('login').classList.remove('hidden'); return;
  }
  $('who').textContent = me.name;
  $('role').textContent = ROLE_TH[me.role] || me.role;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  route();
});
setMode(false);
</script>
</body>
</html>
